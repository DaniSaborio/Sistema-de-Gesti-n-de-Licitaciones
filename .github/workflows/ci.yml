name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "9.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-and-unit-test:
    name: Compilar, analizar y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: dotnet restore Licitaciones.slnx

      - name: Verificar formato (dotnet format)
        run: dotnet format Licitaciones.slnx --verify-no-changes --severity warn

      - name: Compilar (Release, sin advertencias evitables)
        run: dotnet build Licitaciones.slnx --configuration Release --no-restore /warnaserror

      - name: Revisar dependencias vulnerables
        run: dotnet list Licitaciones.slnx package --vulnerable --include-transitive

      - name: Pruebas unitarias con cobertura (Domain + Application)
        run: >
          dotnet test tests/Licitaciones.UnitTests/Licitaciones.UnitTests.csproj
          --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --logger "trx;LogFileName=unit-tests.trx"

      - name: Publicar resultados de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-unit-tests
          path: ./coverage

  integration-and-functional-tests:
    name: Pruebas de integración y funcionales (Docker)
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: dotnet restore Licitaciones.slnx

      - name: Instalar navegadores de Playwright
        run: |
          dotnet build tests/Licitaciones.FunctionalTests/Licitaciones.FunctionalTests.csproj -c Release
          pwsh tests/Licitaciones.FunctionalTests/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      - name: Pruebas de integración (Testcontainers + PostgreSQL real)
        run: >
          dotnet test tests/Licitaciones.IntegrationTests/Licitaciones.IntegrationTests.csproj
          --configuration Release
          --logger "trx;LogFileName=integration-tests.trx"

      - name: Pruebas funcionales E2E (Playwright)
        run: >
          dotnet test tests/Licitaciones.FunctionalTests/Licitaciones.FunctionalTests.csproj
          --configuration Release
          --logger "trx;LogFileName=functional-tests.trx"

  docker-build:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build de la imagen (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sistema-gestion-licitaciones:ci

      - name: Calcular nombre de imagen en minúsculas
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: imagen
        run: echo "nombre=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/sistema-gestion-licitaciones" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en GHCR (solo main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen en GHCR (solo main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.imagen.outputs.nombre }}:latest

  validar-manifiestos-k8s:
    name: Validar manifiestos de Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar YAML con kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -summary -strict k8s/*.yaml
