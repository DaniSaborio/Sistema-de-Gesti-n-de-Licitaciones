# Plantilla de ejemplo (sección 13.2 y 14.2 del enunciado: no se suben secretos reales
# al repositorio). Antes de desplegar:
#   cp k8s/app-secret.example.yaml k8s/app-secret.yaml
#   # editar los valores reales en app-secret.yaml (que debe quedar fuera de git)
#   kubectl apply -f k8s/app-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: licitaciones-db-credentials
  namespace: licitaciones
type: Opaque
stringData:
  POSTGRES_USER: "licitaciones"
  POSTGRES_PASSWORD: "CAMBIAR_ESTE_VALOR"
  ConnectionStrings__LicitacionesDb: "Host=licitaciones-postgres.licitaciones.svc.cluster.local;Port=5432;Database=licitaciones;Username=licitaciones;Password=CAMBIAR_ESTE_VALOR"
